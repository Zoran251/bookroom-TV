<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookroom TV — Izbor panela</title>
    <style>
      :root {
        --bg: #120f15;
        --panel: #1b1820;
        --panel-2: #241f2d;
        --gold: #d3b57d;
        --gold-strong: #c79d52;
        --text: #f3efe9;
        --muted: #c9bfd3;
        --border: rgba(255,255,255,0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top, rgba(140, 112, 78, 0.28), transparent 30%),
          linear-gradient(180deg, #0f0d13 0%, var(--bg) 100%);
        color: var(--text);
      }

      .wrap {
        width: min(900px, calc(100% - 32px));
        background: rgba(18, 15, 21, 0.8);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 32px 28px;
        box-shadow: 0 24px 60px rgba(0,0,0,0.45);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 4vw, 3rem);
        text-align: center;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .subtitle {
        margin: 0 0 28px;
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 22px;
      }

      .card {
        display: block;
        padding: 28px 22px;
        border-radius: 18px;
        text-decoration: none;
        color: var(--text);
        background: linear-gradient(180deg, var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.02);
      }

      .card:hover,
      .card:focus-visible {
        transform: translateY(-4px);
        border-color: rgba(211,181,125,0.7);
        box-shadow: 0 18px 30px rgba(0,0,0,0.25);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 74px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(211,181,125,0.12);
        color: var(--gold);
        border: 1px solid rgba(211,181,125,0.4);
        font-size: 0.72rem;
        letter-spacing: 0.09em;
        text-transform: uppercase;
      }

      h2 {
        margin: 18px 0 10px;
        font-size: clamp(1.5rem, 2vw, 2rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Bookroom TV</h1>
      <p class="subtitle">Izaberite panel koji želite da otvorite</p>

      <div class="grid">
        <a class="card" href="admin/" aria-label="Otvorite admin panel">
          <div class="badge">Admin</div>
          <h2>Admin panel</h2>
          <p>Upravljajte sadržajem, sobama, gostima i prikazom sadržaja na hotel TV-u.</p>
        </a>

        <a class="card" href="hotel-tv-panel.html" aria-label="Otvorite TV konzolu">
          <div class="badge">TV</div>
          <h2>TV konzola</h2>
          <p>Pregled sadržaja za goste i prikaz aktivnog hotel screensaver/panela.</p>
        </a>
      </div>
    </main>
  </body>
</html>
