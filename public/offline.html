<!DOCTYPE html>
<html lang="bs">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#120f15">
    <title>Bookroom TV — nema konekcije</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #120f15;
        color: #f3efe9;
      }
      main { width: min(680px, calc(100% - 48px)); text-align: center; }
      h1 { color: #d3b57d; }
      p { color: #c9bfd3; line-height: 1.6; }
      a { color: #f3efe9; }
      a:focus-visible { outline: 4px solid #d3b57d; outline-offset: 6px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Nema internet konekcije</h1>
      <p>Bookroom TV i hotelski podaci koriste online vezu. Povežite uređaj na internet i pokušajte ponovo.</p>
      <a href="/">Pokušaj ponovo</a>
    </main>
  </body>
</html>
