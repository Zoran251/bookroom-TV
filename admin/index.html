<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#120f15">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<title>Villa Aura — Admin panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
 
  :root{
    --bg-room:#14100f;
    --panel:#1d1a24;
    --panel-2:#241f2e;
    --tile-purple:#4b3d63;
    --tile-purple-2:#5c4c78;
    --text-main:#f4f1ea;
    --text-muted:#b7aec4;
    --text-dim:#7c7590;
    --accent-gold:#c9a469;
    --accent-teal:#4fb3ab;
    --danger:#c26b6b;
    --border:rgba(255,255,255,0.08);
    --radius:12px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, rgba(60,50,40,0.28), transparent 60%),
      var(--bg-room);
    color:var(--text-main);
    min-height:100vh;
  }
 
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--border);
    background:rgba(20,16,15,0.6);
    backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:28px;height:28px;color:var(--accent-gold); }
  .brand-name{ font-family:'Fraunces',serif; font-size:17px; font-weight:500; }
  .brand-name span{ display:block; font-size:9px; letter-spacing:0.28em; color:var(--text-muted); text-transform:uppercase; font-family:'Inter',sans-serif; margin-top:1px; }
 
  .save-status{ font-size:12px; color:var(--text-dim); min-width:140px; text-align:right; }
  .save-status.ok{ color:var(--accent-teal); }
  .save-status.err{ color:var(--danger); }
 
  .layout{ display:flex; min-height:calc(100vh - 65px); }
 
  .sidebar{
    width:230px; flex-shrink:0; border-right:1px solid var(--border);
    padding:18px 12px; background:rgba(20,16,15,0.35);
  }
  .sidebar h3{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-dim);
    padding:8px 10px 10px;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
    color:var(--text-muted); font-size:13.5px; font-weight:500; cursor:pointer; margin-bottom:2px;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item svg{ width:17px; height:17px; flex-shrink:0; }
  .nav-item:hover{ background:rgba(255,255,255,0.04); color:var(--text-main); }
  .nav-item.active{ background:var(--tile-purple); color:#fff; }
  .nav-item .count{
    margin-left:auto; font-size:10.5px; color:var(--text-dim); background:rgba(255,255,255,0.06);
    padding:1px 7px; border-radius:8px;
  }
  .nav-item.active .count{ color:#e9e4f4; background:rgba(255,255,255,0.12); }
 
  .content{ flex:1; padding:26px 32px; max-width:980px; }
 
  .content-header{
    display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:22px;
  }
  .content-title{ font-family:'Fraunces',serif; font-size:26px; font-weight:500; }
  .content-sub{ color:var(--text-dim); font-size:13px; margin-top:4px; }
 
  .btn{
    border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:600;
    cursor:pointer; font-family:'Inter',sans-serif; display:inline-flex; align-items:center; gap:7px;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg,var(--accent-gold),#a97f44); color:#1d1610; }
  .btn-ghost{ background:rgba(255,255,255,0.06); color:var(--text-main); border:1px solid var(--border); }
  .btn-danger{ background:rgba(194,107,107,0.15); color:#e6a3a3; border:1px solid rgba(194,107,107,0.3); }
  .btn-small{ padding:6px 12px; font-size:12px; }
  .btn svg{ width:14px; height:14px; }
  .btn:disabled{ opacity:0.5; cursor:not-allowed; }
 
  .entry-list{ display:flex; flex-direction:column; gap:10px; }
  .entry-card{
    display:flex; gap:14px; align-items:center; background:var(--panel); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px 14px;
  }
  .entry-thumb{
    width:64px; height:64px; border-radius:8px; flex-shrink:0; background-size:cover; background-position:center;
    background-color:var(--tile-purple); display:flex; align-items:center; justify-content:center; color:var(--text-dim);
  }
  .entry-thumb svg{ width:22px; height:22px; }
  .entry-body{ flex:1; min-width:0; }
  .entry-title{ font-weight:600; font-size:14.5px; }
  .entry-sub{ font-size:12.5px; color:var(--accent-gold); margin-top:1px; }
  .entry-desc{ font-size:12.5px; color:var(--text-dim); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entry-actions{ display:flex; gap:6px; flex-shrink:0; }
 
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-dim); border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state svg{ width:34px; height:34px; margin-bottom:10px; opacity:0.6; }
  .empty-state p{ font-size:13.5px; margin-bottom:14px; }
 
  .loading{ text-align:center; padding:50px; color:var(--text-dim); font-size:13px; }
 
  .overlay{
    position:fixed; inset:0; background:rgba(10,8,10,0.65); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background:var(--panel-2); border:1px solid var(--border); border-radius:16px; width:100%; max-width:520px;
    padding:26px; max-height:90vh; overflow-y:auto;
  }
  .modal h2{ font-family:'Fraunces',serif; font-size:20px; font-weight:500; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600; }
  .field input, .field textarea{
    width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text-main); font-family:'Inter',sans-serif; font-size:13.5px;
  }
  .field input:focus, .field textarea:focus{ outline:none; border-color:var(--accent-gold); }
  .field textarea{ resize:vertical; min-height:70px; }
  .field-hint{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
 
  .image-drop{
    border:1.5px dashed var(--border); border-radius:10px; padding:16px; text-align:center;
    cursor:pointer; transition:border-color .15s ease, background .15s ease; position:relative;
  }
  .image-drop:hover{ border-color:var(--accent-gold); background:rgba(201,164,105,0.05); }
  .image-drop input[type=file]{
    position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
  }
  .image-drop .drop-icon{ width:22px; height:22px; color:var(--text-dim); margin:0 auto 8px; }
  .image-drop .drop-text{ font-size:12.5px; color:var(--text-muted); }
  .image-drop .drop-text b{ color:var(--accent-gold); }
 
  .image-preview-wrap{ display:flex; align-items:center; gap:12px; }
  .image-preview{
    width:80px; height:80px; border-radius:10px; background-size:cover; background-position:center;
    background-color:var(--tile-purple); flex-shrink:0; border:1px solid var(--border);
  }
  .image-preview-info{ flex:1; font-size:12.5px; color:var(--text-muted); }
  .image-preview-info .fname{ color:var(--text-main); font-weight:600; margin-bottom:2px; word-break:break-all; }
  .image-preview-list{ display:grid; gap:10px; margin-bottom:10px; }
 
  /* Bookings */
  .sidebar .divider{ height:1px; background:var(--border); margin:14px 6px; }
  .booking-card{ display:flex; gap:14px; align-items:center; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; }
  .booking-room{
    width:56px; height:56px; border-radius:10px; flex-shrink:0; background:linear-gradient(160deg,var(--tile-purple),var(--tile-purple-2));
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-size:15px; font-weight:600;
  }
  .booking-body{ flex:1; min-width:0; }
  .booking-name{ font-weight:600; font-size:14.5px; }
  .booking-dates{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .badge{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; letter-spacing:0.03em; text-transform:uppercase; white-space:nowrap; }
  .badge-active{ background:rgba(79,179,171,0.18); color:var(--accent-teal); }
  .badge-upcoming{ background:rgba(201,164,105,0.18); color:var(--accent-gold); }
  .badge-past{ background:rgba(255,255,255,0.06); color:var(--text-dim); }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .field input[type="date"]{ color-scheme:dark; }

  .auth-gate{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg-room); }
  .auth-card{ width:100%; max-width:420px; background:var(--panel-2); border:1px solid var(--border); border-radius:16px; padding:28px; }
  .auth-card h1{ font-family:'Fraunces',serif; font-size:26px; font-weight:500; margin-bottom:8px; }
  .auth-card p{ color:var(--text-muted); font-size:13px; margin-bottom:20px; }
  .auth-card .field{ margin-bottom:14px; }
  .auth-card .btn{ width:100%; justify-content:center; }
  .auth-toggle{ display:block; width:100%; margin-top:14px; text-align:center; color:var(--text-muted); font-size:12px; cursor:pointer; text-decoration:none; }
  .auth-toggle:hover{ color:var(--text-main); }
  .auth-error{ min-height:18px; color:var(--danger); font-size:12px; margin-bottom:10px; }
  .auth-error.success{ color:var(--accent-teal); }
  .auth-hotel-fields{ display:none; }
  .auth-card.register .auth-hotel-fields{ display:block; }
  .auth-card.register .auth-title-login,
  .auth-card.register .auth-description-login{ display:none; }
  .auth-card:not(.register) .auth-title-register,
  .auth-card:not(.register) .auth-description-register{ display:none; }
  .auth-card.register .auth-title-register,
  .auth-card.register .auth-description-register{ display:block; }
  .auth-card.register .auth-title-register{ margin-bottom:8px; }
  .auth-card.register .auth-description-register{ margin-bottom:20px; }
  .logout-btn{ margin-left:12px; }
  .mobile-menu-toggle{ display:none; }

  @media (max-width: 760px){
    .topbar{
      align-items:flex-start;
      flex-wrap:wrap;
      gap:12px;
      padding:14px 16px;
    }
    .topbar > div:last-child{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
    }
    .save-status{ min-width:0; margin-right:auto; }
    .logout-btn{ margin-left:0; }

    .layout{ display:block; min-height:0; }
    .sidebar{
      width:100%;
      padding:10px 10px 8px;
      border-right:0;
      border-bottom:1px solid var(--border);
      overflow-x:auto;
      overscroll-behavior-x:contain;
    }
    .sidebar h3{ padding:5px 8px 7px; }
    .sidebar .divider{ margin:8px 6px; }
    #hotelHeaderNavItem,
    #bookingNavItem,
    #tvPairingNavItem,
    #navList{
      display:flex;
      gap:6px;
      min-width:max-content;
    }
    .nav-item{
      flex:0 0 auto;
      margin-bottom:0;
      padding:9px 10px;
      font-size:12px;
    }
    .nav-item .count{ margin-left:4px; }

    .content{
      width:100%;
      max-width:none;
      padding:20px 14px 32px;
    }
    .content-header{
      align-items:stretch;
      flex-direction:column;
      gap:14px;
      margin-bottom:18px;
    }
    .content-title{ font-size:23px; }
    .content-sub{ line-height:1.45; }
    #addBtn{ width:100%; justify-content:center; }

    .entry-card,
    .booking-card{
      align-items:flex-start;
      flex-wrap:wrap;
      gap:10px;
      padding:12px;
    }
    .entry-body,
    .booking-body{ min-width:calc(100% - 78px); }
    .entry-desc{ white-space:normal; line-height:1.4; }
    .entry-actions{
      width:100%;
      justify-content:flex-end;
      flex-wrap:wrap;
    }
    .entry-actions .btn{ flex:1 1 auto; justify-content:center; }
    .modal{ padding:20px 16px; max-height:94vh; }
    .field-row{ flex-direction:column; gap:0; }
    .modal-actions{ flex-direction:column-reverse; }
    .modal-actions .btn{ width:100%; justify-content:center; }
  }

  @media (max-width: 480px){
    .brand-name{ font-size:15px; }
    .brand-name span{ letter-spacing:0.16em; }
    .topbar > div:last-child{ justify-content:stretch; }
    .topbar > div:last-child .btn{ flex:1; justify-content:center; }
    .save-status{ flex:1 1 100%; text-align:left; }
    .auth-gate{ padding:12px; align-items:flex-start; overflow-y:auto; }
    .auth-card{ margin-top:12px; padding:22px 16px; }
    .auth-card h1{ font-size:23px; }
    .auth-card p{ line-height:1.45; }
    .content{ padding-left:12px; padding-right:12px; }
    .entry-thumb{ width:54px; height:54px; }
    .entry-body,
    .booking-body{ min-width:calc(100% - 68px); }
  }

  @media (max-width: 760px){
    body{ padding-bottom:76px; }
    .sidebar{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:30;
      display:flex;
      align-items:center;
      gap:6px;
      height:66px;
      padding:7px 10px;
      background:rgba(20,16,15,0.96);
      border-top:1px solid var(--border);
      border-bottom:0;
      box-shadow:0 -12px 28px rgba(0,0,0,0.26);
      overflow-x:auto;
      scrollbar-width:none;
    }
    .sidebar::-webkit-scrollbar{ display:none; }
    .sidebar h3,
    .sidebar .divider{ display:none; }
    #hotelHeaderNavItem,
    #bookingNavItem,
    #tvPairingNavItem,
    #navList{
      display:contents;
    }
    .nav-item{
      min-width:max-content;
      height:50px;
      margin:0;
      padding:7px 10px;
      border-radius:10px;
      flex-direction:column;
      justify-content:center;
      gap:3px;
      font-size:10px;
      line-height:1;
    }
    .nav-item svg{ width:17px; height:17px; }
    .nav-item .count{ display:none; }
    .content{ padding-bottom:22px; }
  }

  @media (max-width: 760px){
    body{ padding-bottom:0; }
    .mobile-menu-toggle{ display:inline-flex; }
    .sidebar{
      position:fixed;
      inset:0;
      z-index:19;
      display:block;
      width:100%;
      height:100vh;
      padding:86px 14px 24px;
      border:0;
      background:rgba(20,16,15,0.98);
      box-shadow:0 18px 40px rgba(0,0,0,0.35);
      overflow-y:auto;
      transform:translateY(-105%);
      transition:transform .22s ease;
    }
    .sidebar.mobile-open{ transform:translateY(0); }
    .sidebar h3,
    .sidebar .divider{ display:block; }
    #hotelHeaderNavItem,
    #bookingNavItem,
    #navList{ display:block; min-width:0; }
    .nav-item{
      width:100%;
      height:auto;
      min-width:0;
      margin-bottom:4px;
      padding:12px;
      flex-direction:row;
      justify-content:flex-start;
      gap:10px;
      font-size:13px;
      line-height:normal;
    }
    .nav-item .count{ display:block; margin-left:auto; }
  }
 
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.15); border-radius:4px; }
</style>
</head>
<body>

<div class="auth-gate" id="authGate">
  <form class="auth-card" id="authCard">
    <h1 class="auth-title-login">Prijava admina</h1>
    <h1 class="auth-title-register">Registracija hotela</h1>
    <p class="auth-description-login">Prijavi se da upravljaš podacima svog hotela.</p>
    <p class="auth-description-register">Kreiraj admin nalog i odvojenu bazu podataka svog hotela.</p>
    <div class="auth-hotel-fields">
      <div class="field"><label>Naziv hotela</label><input id="authHotelName" autocomplete="organization" placeholder="npr. Hotel Rafaelo"></div>
      <div class="field"><label>Grad</label><input id="authCity" autocomplete="address-level2" placeholder="npr. Sarajevo"></div>
    </div>
    <div class="field"><label>Korisničko ime</label><input id="authUsername" autocomplete="username" placeholder="npr. hotelrafaelo"></div>
    <div class="field"><label>PIN (najmanje 6 znakova)</label><input id="authPin" type="password" autocomplete="current-password" inputmode="numeric" placeholder="Unesite PIN"></div>
    <div class="auth-error" id="authError" role="alert"></div>
    <button class="btn btn-primary" id="authSubmit" type="submit">Prijavi se</button>
    <a class="auth-toggle" id="authToggle" href="?mode=register">Nemaš admin nalog? Registruj hotel</a>
  </form>
</div>
 
<div class="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 C9 6 6 8 6 12 a6 6 0 0 0 12 0 c0-4-3-6-6-10Z"/></svg>
    </div>
    <div class="brand-name">Villa Aura<span>Admin — TV sadržaj</span></div>
  </div>
  <div>
    <span class="save-status" id="saveStatus">Spremno</span>
    <button class="btn btn-ghost btn-small mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false">☰ Sekcije</button>
    <a class="btn btn-ghost btn-small" href="/hotel-tv-panel.html" target="_blank" rel="noopener">TV konzola</a>
    <button class="btn btn-ghost btn-small logout-btn" id="logoutBtn">Odjava</button>
  </div>
</div>
 
<div class="layout">
  <div class="sidebar" id="mobileSidebar">
    <h3>Sistem</h3>
    <div id="hotelHeaderNavItem"></div>
    <div id="bookingNavItem"></div>
    <div id="tvPairingNavItem"></div>
    <div class="divider"></div>
    <h3>Pločice</h3>
    <div id="navList"></div>
  </div>
  <div class="content">
    <div class="content-header">
      <div>
        <div class="content-title" id="catTitle">—</div>
        <div class="content-sub" id="catSub"></div>
      </div>
      <button class="btn btn-primary" id="addBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj unos
      </button>
    </div>
    <div id="entryContainer"><div class="loading">Učitavanje…</div></div>
  </div>
</div>
 
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Novi unos</h2>
    <div id="formFields"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">Otkaži</button>
      <button class="btn btn-primary" id="saveBtn">Sačuvaj</button>
    </div>
  </div>
</div>
 
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { getAdminContext, loadHotelHeader, loadModuleEntries, saveHotelHeader, saveModuleEntries, loadBookings, saveBookings, signInAdmin, signOutAdmin, signUpAdmin, sendPowerTvCommand, subscribeToCommand, createTvPairing, loadTvPairings, revokeTvPairing } from './src/lib/adminStorage.js'

const ICONS = {
  hotelinfo: '<path d="M4 21V9l8-6 8 6v12"/><path d="M9 21v-6h6v6"/>',
  restorani: '<path d="M6 2v8a2 2 0 0 0 2 2v10M6 2v8M9 2v8M18 2v20M18 2a4 4 0 0 0-4 4v4h4"/>',
  wellness: '<path d="M12 2 C9 6 6 8 6 12 a6 6 0 0 0 12 0 c0-4-3-6-6-10Z"/>',
  sport: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/>',
  okolica: '<path d="M3 12l9-9 9 9M5 10v10h14V10"/>',
  poruke: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  budjenje: '<circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M8 2 4 5M16 2l4 3"/>',
  servis: '<path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.3"/>',
  narudzbe: '<path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>',

function closeMobileMenu(){
  mobileSidebar.classList.remove('mobile-open');
  mobileMenuToggle.setAttribute('aria-expanded', 'false');
  mobileMenuToggle.textContent = '☰ Sekcije';
}

function setAuthMode(register){
  isRegisterMode = register;
  authCard.classList.toggle('register', register);
  authSubmit.textContent = register ? 'Registruj admina' : 'Prijavi se';
  authToggle.textContent = register ? 'Već imaš admin profil? Prijavi se' : 'Nemaš admin profil? Registruj se';
  authToggle.href = register ? '?mode=login' : '?mode=register';
  authError.textContent = '';
}

function authMessage(error){
  authError.classList.remove('success');
  authError.textContent = error && error.message ? error.message : 'Došlo je do greške. Pokušaj ponovo.';
}

function authSuccess(message){
  authError.classList.add('success');
  authError.textContent = message;
}

async function authenticate(){
  authSubmit.disabled = true;
  authError.textContent = '';
  try{
    const username = document.getElementById('authUsername').value.trim();
    const pin = document.getElementById('authPin').value;
    if(!username || !pin){ throw new Error('Korisničko ime i PIN su obavezni.'); }
    if(pin.length < 6){ throw new Error('PIN mora imati najmanje 6 znakova.'); }
    if(isRegisterMode){
      const hotelName = document.getElementById('authHotelName').value.trim();
      const city = document.getElementById('authCity').value.trim();
      if(!hotelName){ throw new Error('Naziv hotela je obavezan.'); }
      if(!city){ throw new Error('Grad je obavezan.'); }
      await signUpAdmin({ username, pin, hotelName, city });
      setAuthMode(false);
      document.getElementById('authPin').value = '';
      authSuccess('Registracija je uspješna. Sada se prijavi sa svojim korisničkim imenom i PIN-om.');
      return;
    } else {
      await signInAdmin(username, pin);
    }
    authGate.style.display = 'none';
    await renderAll();
  }catch(error){
    authMessage(error);
  }finally{
    authSubmit.disabled = false;
  }
}

authForm.addEventListener('submit', (event) => {
  event.preventDefault();
  authenticate();

if (!window.storage) {
  window.storage = {
    async get(key) {
      try {
        const value = localStorage.getItem(key);
        return value === null ? { value: null } : { value };
      } catch (error) {
        return { value: null };
      }
    },
    async set(key, value) {
      try {
        localStorage.setItem(key, value);
        return true;
      } catch (error) {
        return false;
      }
    }
  };
}

async function renderTvPairings(generatedCode = ''){
  document.getElementById('catTitle').textContent = 'Uparivanje TV-a';
  document.getElementById('catSub').textContent = 'Poveži TV konzolu sa sobom da bi prikazivala podatke iz admin panela.';
  document.getElementById('addBtn').style.display = 'none';
  const container = document.getElementById('entryContainer');
  container.innerHTML = '<div class="loading">Učitavanje…</div>';

  let pairings = [];
  let pairingLoadError = null;
  try{
    pairings = await loadTvPairings();
  }catch(error){
    if(!generatedCode){
      container.innerHTML = '<div class="empty-state"><p>Nije moguće učitati uparene TV uređaje.</p></div>';
      setStatus(error.message || 'Greška pri učitavanju uparivanja', 'err');
      console.error('Failed loading TV pairings', error);
      return;
    }
    pairingLoadError = error;
    console.error('Failed refreshing TV pairings after code creation', error);
  }

  try{
    const pairingRows = pairings.length
      ? pairings.map((pairing) => `
        <div class="entry-card">
          <div class="entry-body">
            <div class="entry-title">Soba ${escapeHtml(pairing.room_number)}</div>
            <div class="entry-sub">${pairing.revoked_at ? 'Uparivanje opozvano' : 'Aktivno uparivanje'}</div>
          </div>
          <div class="entry-actions">
            ${pairing.revoked_at ? '' : `<button class="btn btn-danger btn-small" data-revoke-pairing="${escapeAttr(pairing.id)}">Opozovi kod</button>`}
          </div>
        </div>`).join('')
      : '<div class="empty-state"><p>Još nema uparenih TV uređaja.</p></div>';

    container.innerHTML = `
      <div class="modal" style="max-width:620px; padding:0; background:transparent; border:0;">
        <p class="content-sub" style="margin:0 0 16px;">Kod je vezan za sobu i omogućava TV-u samo čitanje hotelskog sadržaja i aktivne rezervacije te sobe. Sačuvaj kod; prikazuje se samo jednom.</p>
        ${pairingLoadError ? '<p class="field-hint">Kod je napravljen, ali lista uređaja se trenutno ne može osvježiti.</p>' : ''}
        <div class="field">
          <label for="pairingRoom">Broj sobe</label>
          <input id="pairingRoom" maxlength="32" autocomplete="off" placeholder="npr. 204">
        </div>
        <button class="btn btn-primary" id="createPairingBtn" type="button">Napravi kod za uparivanje</button>
        <div id="pairingCodeResult"></div>
        <h3 style="margin:28px 0 12px;">TV uređaji</h3>
        <div class="entry-list">${pairingRows}</div>
      </div>`;

    if(generatedCode){
      document.getElementById('pairingCodeResult').innerHTML = `
        <div class="field" style="margin-top:18px;">
          <label>Novi kod — unesi ga na TV-u</label>
          <input id="generatedPairingCode" readonly value="${escapeAttr(generatedCode)}" style="font-family:monospace;letter-spacing:1px;">
          <div class="field-hint">Ovaj kod se više neće moći prikazati u admin panelu. Ako ga izgubiš, opozovi ga i napravi novi.</div>
          <button class="btn btn-ghost btn-small" id="copyPairingCodeBtn" type="button" style="margin-top:8px;">Kopiraj kod</button>
        </div>`;
      document.getElementById('copyPairingCodeBtn').addEventListener('click', async () => {
        try{
          await navigator.clipboard.writeText(generatedCode);
          setStatus('Kod je kopiran', 'ok');
        }catch(error){
          setStatus('Kopiranje nije uspjelo', 'err');
          console.error('Failed copying TV pairing code', error);
        }
      });
    }
    if(pairingLoadError) setStatus('Kod je napravljen; lista se nije osvježila', 'err');

    document.getElementById('createPairingBtn').addEventListener('click', async (event) => {
      const button = event.currentTarget;
      const roomNumber = document.getElementById('pairingRoom').value.trim();
      if(!roomNumber){
        setStatus('Unesi broj sobe', 'err');
        return;
      }

      button.disabled = true;
      setStatus('Kreiranje koda…', '');
      try{
        const pairing = await createTvPairing(roomNumber);
        setStatus('Kod je kreiran', 'ok');
        await renderTvPairings(pairing.code);
      }catch(error){
        setStatus(error.message || 'Greška pri kreiranju koda', 'err');
        console.error('Failed creating TV pairing', error);
        button.disabled = false;
      }
    });

    container.querySelectorAll('[data-revoke-pairing]').forEach((button) => {
      button.addEventListener('click', async () => {
        if(!confirm('Opozvati ovaj kod? TV će izgubiti pristup sadržaju.')) return;
        button.disabled = true;
        try{
          await revokeTvPairing(button.dataset.revokePairing);
          setStatus('Uparivanje je opozvano', 'ok');
          await renderTvPairings();
        }catch(error){
          setStatus(error.message || 'Greška pri opozivu koda', 'err');
          console.error('Failed revoking TV pairing', error);
          button.disabled = false;
        }
      });
    });
  }catch(error){
    container.innerHTML = '<div class="empty-state"><p>Nije moguće učitati uparene TV uređaje.</p></div>';
    setStatus(error.message || 'Greška pri učitavanju uparivanja', 'err');
    console.error('Failed loading TV pairings', error);
  }
}

function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function bookingStatus(b){
  const t = todayStr();
  if(b.checkIn > t) return 'upcoming';
  if(b.checkOut < t) return 'past';
  return 'active';
}
function formatDate(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}.`;
}

async function renderBookings(){
  document.getElementById('catTitle').textContent = BOOKINGS_LABEL;
  document.getElementById('catSub').textContent = BOOKINGS_SUB;
 
  const container = document.getElementById('entryContainer');
  container.innerHTML = '<div class="loading">Učitavanje…</div>';
  const bookings = await loadBookings();
 
  if(bookings.length === 0){
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4">${ICONS.bookings}</svg>
      <p>Još nema unesenih rezervacija</p>
    </div>`;
    return;
  }
 
  const sorted = [...bookings].sort((a,b) => a.checkIn.localeCompare(b.checkIn));
  const badgeInfo = { active:['badge-active','U hotelu'], upcoming:['badge-upcoming','Stiže'], past:['badge-past','Odjavljen/a'] };
 
  container.innerHTML = '';
  const list = document.createElement('div');
  list.className = 'entry-list';
 
  sorted.forEach((b) => {
    const [cls, label] = badgeInfo[bookingStatus(b)];
    const card = document.createElement('div');
    card.className = 'booking-card';
    card.innerHTML = `
      <div class="booking-room">${escapeHtml(b.room || '—')}</div>
      <div class="booking-body">
        <div class="booking-name">${escapeHtml(b.guestName || '(bez imena)')}</div>
        <div class="booking-dates">${formatDate(b.checkIn)} — ${formatDate(b.checkOut)}</div>
      </div>
      <span class="badge ${cls}">${label}</span>
      <div class="entry-actions">
        <button class="btn btn-ghost btn-small" data-action="power-tv" data-room="${escapeAttr(b.room || '')}">TV</button>
        <button class="btn btn-ghost btn-small" data-action="edit" data-id="${b.id}">Uredi</button>
        <button class="btn btn-danger btn-small" data-action="delete" data-id="${b.id}">Obriši</button>
      </div>`;
    list.appendChild(card);
  });
 
  container.appendChild(list);
 
  list.querySelectorAll('[data-action="edit"]').forEach(btn=>{
    btn.addEventListener('click', () => openBookingModal(btn.dataset.id));
  });
  list.querySelectorAll('[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', () => deleteBooking(btn.dataset.id));
  });
  list.querySelectorAll('[data-action="power-tv"]').forEach(btn=>{
    btn.addEventListener('click', () => openPowerTv(btn));
  });
}

async function openPowerTv(button){
  const room = button.dataset.room;
  const originalText = button.textContent;
  button.disabled = true;
  button.textContent = 'Pokretanje…';
  setStatus('Pokretanje TV-a…', '');
  let unsubscribe = () => {};
  try {
    const command = await sendPowerTvCommand(room);
    unsubscribe = await subscribeToCommand(command.id, (updated) => {
      if (updated.status === 'completed') {
        setStatus('Power TV pokrenut', 'ok');
        button.textContent = 'Pokrenut';
        unsubscribe();
      } else if (updated.status === 'failed') {
        setStatus(updated.error_message || 'Power TV nije pokrenut', 'err');
        button.textContent = originalText;
        button.disabled = false;
        unsubscribe();
      }
    });
    setStatus('Komanda poslata TV uređaju', 'ok');
    button.textContent = 'Poslato';
    setTimeout(() => {
      button.disabled = false;
      button.textContent = originalText;
    }, 10000);
  } catch (error) {
    setStatus(error.message || 'Power TV nije pokrenut', 'err');
    button.disabled = false;
    button.textContent = originalText;
  }
}
 
function icon(name){

  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${path}</svg>`;
}
 
function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function escapeAttr(s){ return String(s).replace(/'/g, "%27"); }
 
function fileToDataUrl(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
 
// Downscale large images so they fit comfortably under the 5MB storage limit
function compressImage(dataUrl, maxDim = 1000, quality = 0.82){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if(width > maxDim || height > maxDim){
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
 
async function handleImageInput(inputEl, previewWrapEl){
  const file = inputEl.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){
    alert('Molimo odaberi fajl slike (jpg, png, webp...).');
    return;
  }
  previewWrapEl.innerHTML = `<div class="loading" style="padding:14px;">Obrada slike…</div>`;
  try{
    const rawDataUrl = await fileToDataUrl(file);
    const compressed = await compressImage(rawDataUrl);
    state.pendingImage = compressed;
    renderImagePreview(previewWrapEl, compressed, file.name);
  }catch(e){
    previewWrapEl.innerHTML = `<div class="field-hint">Greška pri učitavanju slike, pokušaj ponovo.</div>`;
  }
}

async function handleMultipleImageInput(inputEl, previewWrapEl){
  const files = Array.from(inputEl.files || []);
  if(!files.length) return;
  if(files.some(file => !file.type.startsWith('image/'))){
    alert('Molimo odaberi samo fajlove slika (jpg, png, webp...).');
    inputEl.value = '';
    return;
  }

  previewWrapEl.querySelector('.multi-image-loading')?.remove();
  const loading = document.createElement('div');
  loading.className = 'field-hint multi-image-loading';
  loading.textContent = 'Obrada slika…';
  previewWrapEl.prepend(loading);
  try{
    const images = await Promise.all(files.map(async (file) => {
      const rawDataUrl = await fileToDataUrl(file);
      return compressImage(rawDataUrl);
    }));
    state.pendingImages = [...state.pendingImages, ...images];
    renderMultipleImageField(previewWrapEl);
  }catch(error){
    loading.textContent = 'Greška pri učitavanju slika, pokušaj ponovo.';
  }finally{
    inputEl.value = '';
  }
}

function renderMultipleImageField(wrapEl){
  wrapEl.replaceChildren();
  if(state.pendingImages.length){
    const list = document.createElement('div');
    list.className = 'image-preview-list';
    state.pendingImages.forEach((image, index) => {
      const preview = document.createElement('div');
      preview.className = 'image-preview-wrap';
      const thumbnail = document.createElement('div');
      thumbnail.className = 'image-preview';
      thumbnail.style.backgroundImage = `url("${image}")`;
      const info = document.createElement('div');
      info.className = 'image-preview-info';
      const fileName = document.createElement('div');
      fileName.className = 'fname';
      fileName.textContent = `Slika ${index + 1}`;
      const size = document.createElement('div');
      size.textContent = `~${Math.round((image.length * 0.75) / 1024)} KB nakon optimizacije`;
      info.append(fileName, size);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'btn btn-ghost btn-small';
      remove.textContent = 'Ukloni';
      remove.addEventListener('click', () => {
        state.pendingImages = state.pendingImages.filter((_, imageIndex) => imageIndex !== index);
        renderMultipleImageField(wrapEl);
      });
      preview.append(thumbnail, info, remove);
      list.appendChild(preview);
    });
    wrapEl.appendChild(list);
  }

  const drop = document.createElement('div');
  drop.className = 'image-drop';
  drop.innerHTML = `
    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${ICONS.image}</svg>
    <div class="drop-text"><b>Dodaj slike</b><br>Možeš odabrati više JPG, PNG ili WEBP slika</div>
    <input type="file" accept="image/*" multiple>`;
  drop.querySelector('input').addEventListener('change', (event) => handleMultipleImageInput(event.target, wrapEl));
  wrapEl.appendChild(drop);
}

function parseArticleLinks(value){
  return value.split(/\r?\n/).map(link => link.trim()).filter(Boolean).map((link) => {
    const candidate = /^https?:\/\//i.test(link) ? link : `https://${link}`;
    const url = new URL(candidate);
    if(url.protocol !== 'http:' && url.protocol !== 'https:') throw new Error('invalid link');
    return url.href;
  });
}

function formatArticleLinks(links){
  return (Array.isArray(links) ? links : [])
    .map(link => typeof link === 'string' ? link : link?.url)
    .filter(Boolean)
    .join('\n');
}
 
function renderImagePreview(wrapEl, dataUrl, fileName){
  const sizeKb = Math.round((dataUrl.length * 0.75) / 1024);
  wrapEl.innerHTML = `
    <div class="image-preview-wrap">
      <div class="image-preview" style="background-image:url('${dataUrl}')"></div>
      <div class="image-preview-info">
        <div class="fname">${escapeHtml(fileName || 'slika')}</div>
        <div>~${sizeKb} KB nakon optimizacije</div>
      </div>
      <button type="button" class="btn btn-ghost btn-small" id="removeImageBtn">Ukloni</button>
    </div>`;
  document.getElementById('removeImageBtn').addEventListener('click', () => {
    state.pendingImage = null;
    renderImageDrop(wrapEl);
  });
}
 
function renderImageDrop(wrapEl){
  wrapEl.innerHTML = `
    <div class="image-drop">
      <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">${ICONS.image}</svg>
      <div class="drop-text"><b>Klikni za odabir slike</b><br>JPG, PNG ili WEBP</div>
      <input type="file" id="f_imageFile" accept="image/*">
    </div>`;
  document.getElementById('f_imageFile').addEventListener('change', (e) => handleImageInput(e.target, wrapEl));
}

function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  state.editingId = null;
  state.pendingImage = null;
  state.pendingImages = [];
}
 
async function saveEntry(cat){
  const entries = await loadCategory(cat.id);
  let entry;
 
  if(cat.type === 'rich'){
    const title = document.getElementById('f_title').value.trim();
    if(!title){ alert('Naslov je obavezan.'); return; }
    if(cat.id === 'account'){
      entry = {
        id: state.editingId || 'e_' + Date.now(),
        title,
        subtitle: document.getElementById('f_subtitle').value.trim(),
        description: document.getElementById('f_description').value.trim(),
        image: state.pendingImage || '',
        hotelName: title,
        location: document.getElementById('f_subtitle').value.trim(),
        contact: document.getElementById('f_contact').value.trim(),
        email: document.getElementById('f_email').value.trim(),
        website: document.getElementById('f_website').value.trim(),
        notes: document.getElementById('f_description').value.trim(),
      };
    } else if(cat.id === 'marketing'){
      entry = {
        id: state.editingId || 'e_' + Date.now(),
        title,
        subtitle: document.getElementById('f_mediaType').value.trim() || 'Image',
        description: document.getElementById('f_description').value.trim(),
        image: state.pendingImage || document.getElementById('f_url').value.trim() || '',
        mediaType: document.getElementById('f_mediaType').value.trim() || 'Image',
        url: document.getElementById('f_url').value.trim(),
        startDate: document.getElementById('f_startDate').value,
        endDate: document.getElementById('f_endDate').value,
        notes: document.getElementById('f_description').value.trim(),
      };
    } else {
      let links;
      try{
        links = parseArticleLinks(document.getElementById('f_links').value);
      }catch(error){
        alert('Unesi ispravne linkove sa adresom web stranice (http:// ili https://).');
        return;
      }
      const images = [...state.pendingImages];
      entry = {
        id: state.editingId || 'e_' + Date.now(),
        title,
        subtitle: document.getElementById('f_subtitle').value.trim(),
        description: document.getElementById('f_description').value.trim(),
        image: images[0] || '',
        images,
        location: document.getElementById('f_location').value.trim(),
        links,
      };
    }
  } else {
    const name = document.getElementById('f_name').value.trim();
    if(!name){ alert('Ovo polje je obavezno.'); return; }
    entry = {
      id: state.editingId || 'e_' + Date.now(),
      name,
      value: document.getElementById('f_value').value.trim(),
    };
  }
 
  const idx = entries.findIndex(e => e.id === entry.id);
  if(idx >= 0) entries[idx] = entry; else entries.push(entry);
 
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  await saveCategory(cat.id, entries);
  saveBtn.disabled = false;
  closeModal();
  renderAll();
}
 
async function deleteEntry(cat, entryId){
  if(!confirm('Obrisati ovaj unos?')) return;
  const entries = await loadCategory(cat.id);
  const filtered = entries.filter(e => e.id !== entryId);
  await saveCategory(cat.id, filtered);
  renderAll();
}

async function saveBooking(){
  const guestName = document.getElementById('b_name').value.trim();
  const room = document.getElementById('b_room').value.trim();
  const checkIn = document.getElementById('b_checkin').value;
  const checkOut = document.getElementById('b_checkout').value;
 
  if(!guestName || !room){ alert('Ime gosta i broj sobe su obavezni.'); return; }
  if(!checkIn || !checkOut){ alert('Unesi oba datuma.'); return; }
  if(checkOut <= checkIn){ alert('Datum odlaska mora biti nakon datuma dolaska.'); return; }
 
  const bookings = await loadBookingList();
  const entry = { id: state.editingId || 'b_' + Date.now(), guestName, room, checkIn, checkOut };
  const idx = bookings.findIndex(x => x.id === entry.id);
  if(idx >= 0) bookings[idx] = entry; else bookings.push(entry);
 
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  await saveBookingList(bookings);
  saveBtn.disabled = false;
  closeModal();
  renderAll();
}
