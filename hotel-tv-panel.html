<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel TV — Početni panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg-room: #14100f;
    --panel-bg: #1d1a24;
    --panel-bg-2: #241f2e;
    --tile-purple: #4b3d63;
    --tile-purple-2: #5c4c78;
    --text-main: #f4f1ea;
    --text-muted: #b7aec4;
    --accent-gold: #c9a469;
    --accent-teal: #4fb3ab;
    --glow: rgba(201,164,105,0.18);
    --radius: 14px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{ height:100%; }

  body{
    font-family:'Inter', sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 50% 20%, rgba(60,50,40,0.35), transparent 60%),
      var(--bg-room);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:40px 20px;
    color:var(--text-main);
  }

  /* TV frame */
  .tv-frame{
    width:100%;
    max-width:1280px;
    background:#0b0a0d;
    border-radius:18px;
    padding:14px;
    box-shadow:
      0 40px 90px rgba(0,0,0,0.65),
      0 0 0 1px rgba(255,255,255,0.03);
  }

  .screen{
    background: linear-gradient(180deg, #1a1620 0%, #14111b 100%);
    border-radius:8px;
    overflow:hidden;
    aspect-ratio: 16 / 9.2;
    display:flex;
    flex-direction:column;
    padding: clamp(16px, 2.4vw, 34px);
    position:relative;
  }

  /* ambient glow signature element */
  .screen::before{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(circle at 82% 78%, var(--glow), transparent 45%);
    pointer-events:none;
  }

  /* Header */
  .header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: clamp(14px, 2vw, 26px);
    z-index:1;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand-mark{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    color:var(--accent-gold);
  }

  .brand-name{
    font-family:'Fraunces', serif;
    font-size: clamp(15px, 1.5vw, 19px);
    font-weight:500;
    letter-spacing:0.02em;
    color:var(--text-main);
  }

  .brand-name span{
    display:block;
    font-size:9px;
    letter-spacing:0.28em;
    color:var(--text-muted);
    text-transform:uppercase;
    font-family:'Inter',sans-serif;
    margin-top:1px;
  }

  .welcome{
    font-family:'Fraunces', serif;
    font-size: clamp(14px, 1.6vw, 20px);
    font-weight:400;
    color:var(--text-main);
    text-align:center;
    flex:1;
  }

  .welcome b{ font-weight:600; color:var(--accent-gold); }

  .status-cluster{
    display:flex;
    align-items:center;
    gap: clamp(10px, 1.6vw, 22px);
    font-size: clamp(11px, 1vw, 13px);
    color:var(--text-muted);
  }

  .status-item{
    display:flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }

  .status-item svg{ width:15px; height:15px; opacity:0.85; }
  .status-item strong{ color:var(--text-main); font-weight:600; }

  .room-pill{
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08);
    padding:4px 12px;
    border-radius:20px;
    font-size: clamp(10px, 0.95vw, 12px);
    color:var(--text-main);
    letter-spacing:0.03em;
  }

  /* Grid */
  .grid{
    flex:1;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: clamp(8px, 1vw, 14px);
    z-index:1;
  }

  .tile{
    position:relative;
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    align-items:flex-end;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.06);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    outline-offset:2px;
  }

  .tile:hover, .tile:focus-visible{
    transform:translateY(-3px);
    box-shadow:0 14px 30px rgba(0,0,0,0.45);
    border-color:rgba(201,164,105,0.4);
  }

  .tile:focus-visible{ outline:2px solid var(--accent-gold); }

  .tile-label{
    position:relative;
    z-index:2;
    padding: 10px 12px;
    font-size: clamp(11px, 1vw, 13.5px);
    font-weight:500;
    color:#eef1fb;
    text-shadow:0 1px 6px rgba(0,0,0,0.6);
  }

  /* Photo tiles */
  .tile.photo{ background-size:cover; background-position:center; }
  .tile.photo::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,8,14,0) 40%, rgba(10,8,14,0.85) 100%);
  }

  .photo-1{ background-image:
    linear-gradient(160deg, rgba(20,50,40,0.35), rgba(10,10,15,0.55)),
    repeating-linear-gradient(115deg, #395a48 0 40px, #2c4838 40px 80px);
  }
  .photo-2{ background-image:
    linear-gradient(160deg, rgba(60,55,70,0.3), rgba(10,10,15,0.5)),
    linear-gradient(200deg, #6b5e78 0%, #3a3244 60%, #221e2c 100%);
  }
  .photo-3{ background-image:
    linear-gradient(160deg, rgba(30,60,90,0.35), rgba(10,10,15,0.6)),
    radial-gradient(circle at 70% 70%, #2a7f8f 0%, #17384a 55%, #0e1f2e 100%);
  }
  .photo-4{ background-image:
    linear-gradient(160deg, rgba(50,60,40,0.35), rgba(10,10,15,0.5)),
    linear-gradient(210deg, #6f7a4d 0%, #40492c 60%, #232819 100%);
  }
  .photo-5{ background-image:
    linear-gradient(160deg, rgba(70,45,60,0.3), rgba(10,10,15,0.55)),
    radial-gradient(circle at 30% 30%, #a9788a 0%, #5a3f52 55%, #2c2030 100%);
  }

  /* Icon tiles */
  .tile.icon{
    background:linear-gradient(160deg, var(--tile-purple), var(--tile-purple-2));
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:10px;
  }

  .tile.icon svg{
    width: clamp(20px, 2vw, 26px);
    height: clamp(20px, 2vw, 26px);
    color:#e9e4f4;
  }

  .tile.icon .tile-label{
    padding:0;
    text-align:center;
    font-weight:500;
  }

  .tile.icon.accent{
    background:linear-gradient(160deg, #2e4a48, #1f3634);
  }

  .tile.icon.weather{
    background:linear-gradient(160deg, #2e3a4a, #1f2934);
    align-items:flex-start;
    justify-content:flex-start;
    padding:12px;
    text-align:left;
  }
  .tile.icon.weather .weather-top{
    font-size:11px; color:var(--text-muted); margin-bottom:4px;
    text-transform:uppercase; letter-spacing:0.08em;
  }
  .tile.icon.weather .weather-temp{
    font-family:'Fraunces', serif;
    font-size:clamp(16px,1.6vw,20px);
    color:var(--text-main);
  }
  .tile.icon.weather .weather-temp span{ color:var(--text-muted); font-size:0.7em; }

  /* Service tile (room service style, spans rows) */
  .tile.service{
    background:linear-gradient(160deg, var(--tile-purple), #3a2f4d);
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .tile.service svg{ width:38px; height:38px; color:#e9e4f4; }
  .tile.service .tile-label{ font-size:14px; }

  /* placement */
  .g-hotel{ grid-column:1 / 3; grid-row:1 / 2; }
  .g-restaurant{ grid-column:3 / 5; grid-row:1 / 2; }
  .g-wellness{ grid-column:5 / 7; grid-row:1 / 3; }
  .g-service{ grid-column:1 / 2; grid-row:2 / 4; }
  .g-sport{ grid-column:2 / 3; grid-row:2 / 3; }
  .g-nearby{ grid-column:2 / 3; grid-row:3 / 4; }
  .g-messages{ grid-column:3 / 4; grid-row:2 / 3; }
  .g-wake{ grid-column:3 / 4; grid-row:3 / 4; }
  .g-hotelservice{ grid-column:4 / 5; grid-row:2 / 3; }
  .g-orders{ grid-column:4 / 5; grid-row:3 / 4; }
  .g-tv{ grid-column:5 / 6; grid-row:3 / 4; }
  .g-radio{ grid-column:6 / 7; grid-row:3 / 4; }

  footer.hint{
    text-align:center;
    color:#6b6577;
    font-size:12px;
    margin-top:16px;
    letter-spacing:0.02em;
  }
</style>
</head>
<body>

<div class="tv-frame">
  <div class="screen">

    <div class="header">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 C9 6 6 8 6 12 a6 6 0 0 0 12 0 c0-4-3-6-6-10Z"/></svg>
        </div>
        <div class="brand-name">Villa Aura<span>Hotel &amp; Spa</span></div>
      </div>

      <div class="welcome">Dobrodošli, <b id="guestName">Gospođo Jozić</b></div>

      <div class="status-cluster">
        <div class="room-pill" id="roomNumber">Soba 6335</div>
        <div class="status-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <strong id="temp">+2°C</strong>
        </div>
        <div class="status-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          <strong id="clock">21:26</strong>
        </div>
        <div class="status-item" id="dateDisplay">16 Stu 2026</div>
      </div>
    </div>

    <div class="grid">
      <div class="tile photo photo-1 g-hotel" tabindex="0">
        <div class="tile-label">Hotelske informacije</div>
      </div>
      <div class="tile photo photo-2 g-restaurant" tabindex="0">
        <div class="tile-label">Restorani i barovi</div>
      </div>
      <div class="tile photo photo-3 g-wellness" tabindex="0">
        <div class="tile-label">Wellness &amp; beauty centri</div>
      </div>

      <div class="tile service g-service" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 18h16M6 18a6 6 0 0 1 12 0M12 4v2M12 6a4 4 0 0 1 4 4H8a4 4 0 0 1 4-4Z"/></svg>
        <div class="tile-label">Posluga u sobu</div>
      </div>

      <div class="tile photo photo-4 g-sport" tabindex="0">
        <div class="tile-label">Sportske aktivnosti</div>
      </div>
      <div class="tile photo photo-5 g-nearby" tabindex="0">
        <div class="tile-label">Zanimljivosti u okolici</div>
      </div>

      <div class="tile icon g-messages" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <div class="tile-label">Poruke</div>
      </div>
      <div class="tile icon g-wake" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M8 2 4 5M16 2l4 3"/></svg>
        <div class="tile-label">Buđenje</div>
      </div>
      <div class="tile icon g-hotelservice" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7Z"/><circle cx="12" cy="9" r="2.3"/></svg>
        <div class="tile-label">Hotelski servis</div>
      </div>
      <div class="tile icon g-orders" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
        <div class="tile-label">Moje narudžbe</div>
      </div>

      <div class="tile icon accent g-tv" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="12" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
        <div class="tile-label">TV</div>
      </div>
      <div class="tile icon accent g-radio" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="8" cy="14" r="2.2"/><path d="M13 12h5M13 16h3M7 8l7-4"/></svg>
        <div class="tile-label">Radio</div>
      </div>
    </div>

  </div>
</div>

<script>
  function updateClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh + ':' + mm;

    const months = ['Jan','Feb','Mar','Apr','Maj','Jun','Jul','Avg','Sep','Okt','Nov','Dec'];
    const dateStr = now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
    document.getElementById('dateDisplay').textContent = dateStr;
  }
  updateClock();
  setInterval(updateClock, 1000 * 15);

  // Simple demo interaction: click any tile to see a focus pulse (placeholder for real navigation)
  document.querySelectorAll('.tile').forEach(t => {
    t.addEventListener('click', () => {
      t.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(0.97)' }, { transform: 'scale(1)' }],
        { duration: 220, easing: 'ease-out' }
      );
    });
  });
</script>

</body>
</html>
