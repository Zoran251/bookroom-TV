name: Build Hotel TV Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "hotel-tv-android/**"
      - "admin/**"
      - "hotel-tv-panel.html"
      - "tv-info.html"
      - "index.html"
      - ".github/workflows/build-hotel-tv-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-tv-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install web dependencies
        working-directory: admin
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android TV application with local console assets
        run: gradle assembleDebug --no-daemon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Hotel TV APK
        uses: actions/upload-artifact@v4
        with:
          name: hotel-tv-debug-apk
          path: hotel-tv-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
